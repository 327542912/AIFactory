name: Build AIFactory ARM64 Runtime

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-aifactory-runtime.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout AIFactory
        uses: actions/checkout@v4

      - name: Checkout Termux build system
        uses: actions/checkout@v4
        with:
          repository: agnostic-apollo/termux-packages
          ref: infra-improvs
          path: termux-packages

      - name: Configure AIFactory package identity
        run: |
          cd termux-packages
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("scripts/properties.sh")
          s = p.read_text()
          keys = ("TERMUX_APP__PACKAGE_NAME", "TERMUX_APP_PACKAGE")
          changed = 0

          for key in keys:
              pattern = rf'(?m)^(\s*{key}\s*=\s*).*$'
              s, n = re.subn(
                  pattern,
                  lambda m: m.group(1) + '"com.aifactory.app"',
                  s
              )
              changed += n

          if not changed:
              raise SystemExit("ERROR: package identity variable not found")

          p.write_text(s)
          print("AIFactory package identity configured.")
          PY

          grep -nE 'TERMUX_APP(_|__)?PACKAGE' scripts/properties.sh

      - name: Omit optional foot terminfo source
        working-directory: termux-packages
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("packages/ncurses/build.sh")
          s = p.read_text()

          for var in ("VERSION", "SRCURL", "SHA256"):
              pattern = re.compile(
                  rf'(?m)^[ \t]*"\$\(\. "\$TERMUX_SCRIPTDIR/'
                  rf'x11-packages/foot/build\.sh"; '
                  rf'echo "\$TERMUX_PKG_{var}"\)"\)\s*$'
              )
              s, n = pattern.subn(")", s)
              if n != 1:
                  raise SystemExit(f"{var}: expected 1 foot entry, found {n}")

          lines = s.splitlines()
          foot_cp = [
              line for line in lines
              if "full-terminfo/f/foot" in line and "cp " in line
          ]
          if len(foot_cp) != 1:
              raise SystemExit(
                  "foot terminfo cp line count mismatch: "
                  + repr(foot_cp)
              )
          s = "\n".join(
              line for line in lines if line != foot_cp[0]
          ) + "\n"

          lines = s.splitlines()
          foot_sed = [
              line for line in lines
              if "foot/foot.info" in line and "sed " in line
          ]
          foot_tic = [
              line for line in lines
              if "tic -x -e foot,foot-direct" in line
          ]

          if len(foot_sed) != 1 or len(foot_tic) != 1:
              raise SystemExit(
                  f"foot sed/tic mismatch: {foot_sed!r}, {foot_tic!r}"
              )

          s = "\n".join(
              line for line in lines
              if line not in (foot_sed[0], foot_tic[0])
          ) + "\n"

          if "x11-packages/foot/build.sh" in s or "foot/foot.info" in s:
              raise SystemExit("Foot source reference remains")

          p.write_text(s)
          print("Foot optional source removed; SHA-256 checks preserved.")
          PY

          git diff --check
          git diff -- packages/ncurses/build.sh

      - name: Build matching Android NDK Docker image
        working-directory: termux-packages
        run: |
          docker build -t ghcr.io/termux/package-builder ./scripts

      - name: Build ARM64 bootstrap
        run: |
          cd termux-packages
          ./scripts/run-docker.sh \
            ./scripts/build-bootstraps.sh \
            --android10 \
            --architectures aarch64

      - name: Verify bootstrap
        run: |
          test -s termux-packages/bootstrap-aarch64.zip
          ls -lh termux-packages/bootstrap-aarch64.zip
          sha256sum termux-packages/bootstrap-aarch64.zip

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aifactory-runtime-aarch64
          path: termux-packages/bootstrap-aarch64.zip
          if-no-files-found: error
          retention-days: 14
