name: Build AIFactory ARM64 Runtime

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "额外打进 bootstrap 的包（逗号分隔；留空 = 只构建基础 bootstrap）"
        required: false
        default: "openjdk-21,gradle,apksigner,git,zip,unzip"
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-aifactory-runtime.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout AIFactory
        uses: actions/checkout@v4

      - name: Checkout Termux build system
        uses: actions/checkout@v4
        with:
          repository: agnostic-apollo/termux-packages
          ref: infra-improvs
          path: termux-packages

      - name: Configure AIFactory package identity
        run: |
          cd termux-packages
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("scripts/properties.sh")
          s = p.read_text()
          keys = ("TERMUX_APP__PACKAGE_NAME", "TERMUX_APP_PACKAGE")
          changed = 0

          for key in keys:
              pattern = rf'(?m)^(\s*{key}\s*=\s*).*$'
              s, n = re.subn(
                  pattern,
                  lambda m: m.group(1) + '"com.aifactory.app"',
                  s
              )
              changed += n

          if not changed:
              raise SystemExit("ERROR: package identity variable not found")

          p.write_text(s)
          print("AIFactory package identity configured.")
          PY

          grep -nE 'TERMUX_APP(_|__)?PACKAGE' scripts/properties.sh

      - name: Omit optional foot terminfo source
        working-directory: termux-packages
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("packages/ncurses/build.sh")
          s = p.read_text()

          for var in ("VERSION", "SRCURL", "SHA256"):
              pattern = re.compile(
                  rf'(?m)^[ \t]*"\$\(\. "\$TERMUX_SCRIPTDIR/'
                  rf'x11-packages/foot/build\.sh"; '
                  rf'echo "\$TERMUX_PKG_{var}"\)"\)\s*$'
              )
              s, n = pattern.subn(")", s)
              if n != 1:
                  raise SystemExit(f"{var}: expected 1 foot entry, found {n}")

          lines = s.splitlines()
          foot_cp = [
              line for line in lines
              if "full-terminfo/f/foot" in line and "cp " in line
          ]
          if len(foot_cp) != 1:
              raise SystemExit(
                  "foot terminfo cp line count mismatch: "
                  + repr(foot_cp)
              )
          s = "\n".join(
              line for line in lines if line != foot_cp[0]
          ) + "\n"

          lines = s.splitlines()
          foot_sed = [
              line for line in lines
              if "foot/foot.info" in line and "sed " in line
          ]
          foot_tic = [
              line for line in lines
              if "tic -x -e foot,foot-direct" in line
          ]

          if len(foot_sed) != 1 or len(foot_tic) != 1:
              raise SystemExit(
                  f"foot sed/tic mismatch: {foot_sed!r}, {foot_tic!r}"
              )

          s = "\n".join(
              line for line in lines
              if line not in (foot_sed[0], foot_tic[0])
          ) + "\n"

          if "x11-packages/foot/build.sh" in s or "foot/foot.info" in s:
              raise SystemExit("Foot source reference remains")

          p.write_text(s)
          print("Foot optional source removed; SHA-256 checks preserved.")
          PY

          git diff --check
          git diff -- packages/ncurses/build.sh

      - name: Patch unbound swig interface
        working-directory: termux-packages
        run: |
          set -euo pipefail

          P=packages/libunbound
          B=$P/build.sh
          grep -q -- '--with-pyunbound' "$B"
          test ! -e "$P/unbound-swig-token.patch"

          base64 -d > "$P/unbound-swig-token.patch" <<'B64'
          
          B64

          VER=$(sed -n 's/^TERMUX_PKG_VERSION="\(.*\)"/\1/p' "$B" | head -1)
          echo "libunbound version: $VER"
          [ -n "$VER" ]

          W=$(mktemp -d)
          mkdir -p "$W/libunbound/python"
          curl -fsSL --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/NLnetLabs/unbound/release-$VER/libunbound/python/libunbound.i" \
            -o "$W/libunbound/python/libunbound.i"
          grep -q '\$function' "$W/libunbound/python/libunbound.i"

          patch -p1 -d "$W" < "$P/unbound-swig-token.patch"
          grep -q '^  \$action' "$W/libunbound/python/libunbound.i"
          ! grep -q '\$function' "$W/libunbound/python/libunbound.i"
          echo "preflight OK"

          echo "--- patch content ---"
          cat "$P/unbound-swig-token.patch"
      - name: Fix docbook-xml download source
        working-directory: termux-packages
        run: |
          set -euo pipefail
          F=packages/docbook-xml/build.sh

          sed -i 's#https://docbook.org/xml/#https://www.oasis-open.org/docbook/xml/#g' "$F"

          N=$(grep -c '^\s*termux_download "https://www\.oasis-open\.org/docbook/xml/' "$F")
          [ "$N" -eq 5 ] || { echo "ERROR: expected 5 termux_download urls, got $N" >&2; exit 1; }
          ! grep -q 'termux_download "https://docbook\.org/xml/' "$F" || { echo "ERROR: docbook.org remains" >&2; exit 1; }
          echo "docbook-xml: rewrote $N source urls"

          for v in 4.1.2 4.2 4.3 4.4 4.5; do
            if [ "$v" = "4.1.2" ]; then f=docbkx412.zip; else f=docbook-xml-$v.zip; fi
            code=$(curl -sIL --retry 3 --max-time 25 -o /dev/null -w '%{http_code}' \
              "https://www.oasis-open.org/docbook/xml/$v/$f")
            echo "  $v -> $code"
            [ "$code" = "200" ] || { echo "ERROR: $v unreachable ($code)" >&2; exit 1; }
          done
          echo "docbook-xml preflight OK"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build matching Android NDK Docker image
        working-directory: termux-packages
        run: |
          docker build -t ghcr.io/termux/package-builder ./scripts

      - name: Build ARM64 bootstrap
        env:
          EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || 'openjdk-21,gradle,apksigner,git,zip,unzip' }}
        run: |
          cd termux-packages
          # 注意：不能加 --android10。该模式生成的是「APK 打包系统」bootstrap：
          # 没有 apt/dpkg、改用 proot，只适用于 targetSdk>=29。
          # AIFactory 使用 targetSdk 28 直接 execve，需要标准 bootstrap。
          ARGS=(--architectures aarch64)
          if [ -n "$EXTRA_PACKAGES" ]; then ARGS+=(--packages-post-additional "$EXTRA_PACKAGES"); fi
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh "${ARGS[@]}"

      - name: Verify bootstrap
        run: |
          test -s termux-packages/bootstrap-aarch64.zip
          ls -lh termux-packages/bootstrap-aarch64.zip
          sha256sum termux-packages/bootstrap-aarch64.zip

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aifactory-runtime-aarch64
          path: termux-packages/bootstrap-aarch64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release (stable download URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=runtime-latest
          sha256sum termux-packages/bootstrap-aarch64.zip | cut -d' ' -f1 > bootstrap-aarch64.zip.sha256
          gh release delete "$TAG" --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" \
            termux-packages/bootstrap-aarch64.zip bootstrap-aarch64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "AIFactory runtime (aarch64)" \
            --notes "SHA-256: $(cat bootstrap-aarch64.zip.sha256)"
          echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/bootstrap-aarch64.zip"
